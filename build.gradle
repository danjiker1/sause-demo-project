plugins {
    id("java")
    id("io.qameta.allure") version "2.12.0"
}

group = "org.example"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    // ===================== JUnit 5 =====================
    testImplementation(platform("org.junit:junit-bom:5.10.0"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    // ===================== JUnit 4 (для Cucumber) =====================
    testImplementation("junit:junit:4.13.2")
    testRuntimeOnly("org.junit.vintage:junit-vintage-engine:5.10.0")

    // ===================== Selenium =====================
    implementation("org.seleniumhq.selenium:selenium-java:4.46.0")

    // ===================== REST Assured =====================
    testImplementation("io.rest-assured:rest-assured:5.5.6")

    // ===================== Cucumber =====================
    implementation("io.cucumber:cucumber-java:7.33.0")
    testImplementation("io.cucumber:cucumber-junit:7.33.0")
    implementation("io.cucumber:cucumber-core:7.33.0")

    // ===================== Другое =====================
    implementation("com.google.code.gson:gson:2.13.2")
    implementation("org.postgresql:postgresql:42.7.12")

    // ===================== Allure =====================
    testImplementation("io.qameta.allure:allure-junit5:2.24.0")
    implementation("io.qameta.allure:allure-java-commons:2.24.0")
}

// ===================== НАСТРОЙКИ ALLURE (Kotlin DSL) =====================
allure {
    version = "2.24.0"
    useJUnit5 {
        version = "2.24.0"
    }
}

tasks.test {
    useJUnitPlatform()
    testLogging {
        events("passed", "skipped", "failed")
        showStandardStreams = true
    }
    maxParallelForks = 1
}